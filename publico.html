<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados en Vivo</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Arial Black', sans-serif; background: #1a1a2e; color: white; text-align: center; padding: 20px; margin: 0; }
        h1 { color: #e94560; font-size: 1.8em; text-transform: uppercase; }
        .leaderboard { max-width: 600px; margin: 0 auto; }
        .entry { display: flex; align-items: center; background: #16213e; margin: 10px 0; padding: 15px; border-radius: 12px; border-left: 6px solid #4d7cfe; transition: 0.4s; }
        .rank-1 { border-left-color: #f1c40f; background: #1f2235; transform: scale(1.05); box-shadow: 0 0 15px rgba(241, 196, 15, 0.2); }
        .rank-2 { border-left-color: #bdc3c7; }
        .rank-3 { border-left-color: #cd7f32; }
        .num { font-size: 1.2em; width: 40px; font-weight: bold; }
        .name { flex-grow: 1; text-align: left; font-size: 1.1em; padding-left: 10px; overflow: hidden; text-overflow: ellipsis; }
        .pts { font-size: 1.4em; font-weight: bold; color: #e94560; }
        #loader { margin-top: 50px; color: #4d7cfe; }
    </style>
</head>
<body>
    <h1>Resultados del Concurso</h1>
    <div id="loader">Conectando con el jurado...</div>
    <div id="display" class="leaderboard"></div>

    <script>
        const SALA_ID = 'concurso-porkcolombia-2026';
        const peer = new Peer();

        peer.on('open', () => {
            const conn = peer.connect(SALA_ID);
            conn.on('open', () => {
                document.getElementById('loader').style.display = 'none';
            });
            conn.on('data', (data) => {
                render(data);
            });
            conn.on('error', () => {
                document.getElementById('loader').innerText = "Sala no encontrada. Esperando al jurado...";
            });
        });

        function render(data) {
            const display = document.getElementById('display');
            display.innerHTML = data.map((p, i) => {
                let cl = "";
                if (i === 0) cl = "rank-1";
                else if (i === 1) cl = "rank-2";
                else if (i === 2) cl = "rank-3";
                return `
                <div class="entry ${cl}">
                    <div class="num">#${i + 1}</div>
                    <div class="name">${p.nombre}</div>
                    <div class="pts">${p.puntos}</div>
                </div>`;
            }).join('');
        }
    </script>
</body>
</html>
