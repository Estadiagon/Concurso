<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Maestro en Cortes</title>
    <link rel="icon" type="image/png" href="Logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: 'Arial Black', sans-serif; 
            background: radial-gradient(circle, #ffffff 0%, #f2f2f2 100%); 
            color: #1a1a1a; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
        }
        .header-card { background: white; display: inline-block; padding: 20px 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .subtitle-pork { background: #f65275; display: inline-flex; align-items: center; gap: 12px; padding: 10px 30px; border-radius: 50px; color: white; font-size: 1em; margin-top: -15px; box-shadow: 0 4px 15px rgba(246, 82, 117, 0.3); }
        .pork-logo-mini { height: 22px; filter: brightness(0) invert(1); }
        
        .sponsor-logo-only {
            max-width: 120px;
            height: auto;
            margin: 10px auto 15px auto;
            display: block;
            border-radius: 50%;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .zone-filter-container { margin-bottom: 25px; }
        .zone-view-select { padding: 8px 16px; border-radius: 20px; border: 2px solid #ccc; font-family: 'Segoe UI', sans-serif; font-weight: bold; font-size: 1em; outline: none; cursor: pointer; background: white; }
        .zone-view-select:focus { border-color: #f39200; }

        .leaderboard { max-width: 700px; margin: 0 auto; }
        .entry { display: flex; align-items: center; background: white; margin: 15px 0; padding: 25px; border-radius: 20px; border: 1px solid rgba(0,0,0,0.05); transition: all 0.5s; box-shadow: 0 8px 15px rgba(0,0,0,0.03); }
        
        /* PODIO */
        .rank-1 { background: linear-gradient(135deg, #f39200 0%, #c6a43e 100%); transform: scale(1.05); color: white; box-shadow: 0 15px 30px rgba(243, 146, 0, 0.25); border: none; }
        .rank-2 { background: linear-gradient(135deg, #bdc3c7 0%, #7f8c8d 100%); transform: scale(1.02); color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.1); border: none; }
        .rank-3 { background: linear-gradient(135deg, #cd7f32 0%, #a0522d 100%); color: white; box-shadow: 0 10px 20px rgba(160, 82, 45, 0.15); border: none; }
        .rank-1 .pts, .rank-2 .pts, .rank-3 .pts { color: white; }
        
        .num { font-size: 2.2em; width: 70px; font-weight: 900; opacity: 0.9; }
        .name-container { flex-grow: 1; text-align: left; padding-left: 15px; }
        .name { font-size: 1.6em; text-transform: uppercase; display: block; }
        .votos-badge { font-family: 'Segoe UI', sans-serif; font-size: 0.75em; color: #888; font-weight: bold; background: #eee; padding: 2px 8px; border-radius: 10px; display: inline-block; margin-top: 4px; }
        .rank-1 .votos-badge, .rank-2 .votos-badge, .rank-3 .votos-badge { background: rgba(255,255,255,0.2); color: white; }
        
        .pts { font-size: 2.8em; font-weight: bold; color: #f39200; }
        #live-dot { display: inline-block; width: 12px; height: 12px; background: #4caf50; border-radius: 50%; margin-right: 8px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        #status-bar { font-size: 0.9em; color: #999; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header-card">
        <img src="Maestros.png" alt="Maestro en Cortes 2026" style="max-width: 260px; height: auto;">
        <br>
        <div class="subtitle-pork">
            <span>4ta EDICIÓN - 2026</span>
            <img src="porkcolombia.png" class="pork-logo-mini" alt="Porkcolombia">
        </div>
    </div>

    <img src="sello.png" class="sponsor-logo-only" alt="Sello Círculo de Oro PIC">

    <div class="zone-filter-container">
        <select id="zoneViewSelect" class="zone-view-select" onchange="cambiarZonaFiltro()">
            <option value="Bogota - Guadalupe">Sede: Bogotá - Frigorífico Guadalupe</option>
            <option value="Medellin">Sede: Medellín - Central Ganadera</option>
            <option value="Pereira">Sede: Pereira - Planta de Beneficio OINC</option>
            <option value="Barranquilla">Sede: Barranquilla - Frigorífico Santa Cruz</option>
            <option value="Bogota - BLE">Sede: Bogotá - BLE</option>
            <option value="Cali">Sede: Cali - Carnes y Derivados de Occidente</option>
            <option value="Bogota - Corferias">Sede: Bogotá - Corferias (Gran Final)</option>
        </select>
    </div>

    <div id="status-bar">Conectando...</div>
    <div id="display" class="leaderboard">Cargando maestros...</div>

    <script>
        const SUPABASE_URL = 'https://uapptgffjuauwunhbvqu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ZnGg75rZoPLIAvhnCRum2A_b7jhYgYe';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let zonaFiltro = "Bogota - Guadalupe";

        function cambiarZonaFiltro() {
            zonaFiltro = document.getElementById("zoneViewSelect").value;
            loadData();
        }

        function calcularNotaFinal(p) {
            const nTecnica = (p.tecnica || 0) * 0.35;
            const nRendimiento = (p.rendimiento || 0) * 0.25;
            const nHigiene = (p.higiene || 0) * 0.20;
            const nParametros = (p.parametros || 0) * 0.10;
            const nPresentacion = (p.presentacion || 0) * 0.10;
            return nTecnica + nRendimiento + nHigiene + nParametros + nPresentacion;
        }

        async function loadData() {
            const { data: participantes, error: errP } = await db.from('participantes').select('*').eq('zona', zonaFiltro);
            const { data: calificaciones, error: errC } = await db.from('calificaciones').select('*');
            
            if (errP || errC) { document.getElementById('status-bar').textContent = '❌ Error de sincronización'; return; }
            
            const listaProcesada = participantes.map(p => {
                const lasNotas = calificaciones.filter(c => c.participante_id === p.id);
                const cantidadJurados = lasNotas.length;

                if (cantidadJurados === 0) {
                    return { id: p.id, nombre: p.nombre, notaFinal: 0, totalJurados: 0 };
                }

                let sumaTecnica = 0, sumaRendimiento = 0, sumaHigiene = 0, sumaParametros = 0, sumaPresentacion = 0;
                
                lasNotas.forEach(n => {
                    sumaTecnica += (n.tecnica || 0);
                    sumaRendimiento += (n.rendimiento || 0);
                    sumaHigiene += (n.higiene || 0);
                    sumaParametros += (n.parametros || 0);
                    sumaPresentacion += (n.presentacion || 0);
                });

                const promTecnica = sumaTecnica / cantidadJurados;
                const promRendimiento = sumaRendimiento / cantidadJurados;
                const promHigiene = sumaHigiene / cantidadJurados;
                const promParametros = sumaParametros / cantidadJurados;
                const promPresentacion = sumaPresentacion / cantidadJurados;

                const notaFinalCalculada = (promTecnica * 0.35) + (promRendimiento * 0.25) + (promHigiene * 0.20) + (promParametros * 0.10) + (promPresentacion * 0.10);

                return {
                    id: p.id,
                    nombre: p.nombre,
                    notaFinal: notaFinalCalculada,
                    totalJurados: cantidadJurados
                };
            });

            listaProcesada.sort((a, b) => b.notaFinal - a.notaFinal);
            render(listaProcesada);
        }

        function render(data) {
            const display = document.getElementById('display');
            if (!data || data.length === 0) { display.innerHTML = "<p style='color:#888;'>Esperando el ingreso de datos de jurados para esta sede...</p>"; return; }
            
            display.innerHTML = data.map((p, i) => {
                let podioClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
                
                let displayName = p.nombre;
                
                // Si la sede seleccionada es Corferias, extraemos únicamente los números del final del nombre
                if (zonaFiltro === "Bogota - Corferias") {
                    const extraeNumeros = p.nombre.match(/\d+$/); // Busca los dígitos al final de la cadena
                    displayName = extraeNumeros ? `PARTICIPANTE #${extraeNumeros[0]}` : `PARTICIPANTE #${p.id}`;
                }

                return `
                    <div class="entry ${podioClass}">
                        <div class="num">#${i + 1}</div>
                        <div class="name-container">
                            <span class="name">${displayName}</span>
                            <span class="votos-badge">${p.totalJurados} ${p.totalJurados === 1 ? 'Jurado calificó' : 'Jurados calificaron'}</span>
                        </div>
                        <div class="pts">${p.notaFinal.toFixed(2)}</div>
                    </div>
                `;
            }).join('');
        }

        db.channel('pork-public')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'participantes' }, () => loadData())
          .on('postgres_changes', { event: '*', schema: 'public', table: 'calificaciones' }, () => loadData())
          .subscribe(s => {
              if (s === 'SUBSCRIBED') document.getElementById('status-bar').innerHTML = '<span id="live-dot"></span> EN VIVO CON MULTI-JURADO';
          });

        window.onload = loadData;
    </script>
</body>
</html>
