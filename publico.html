<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Maestro en Cortes</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Arial Black', sans-serif; background: #1a1a1a; color: white; text-align: center; margin: 0; padding: 20px; }
        .title-gold { color: #f39200; font-size: 2.5em; margin: 10px 0 0 0; text-transform: uppercase; }
        .subtitle { font-size: 1.2em; color: white; background: #f65275; display: inline-block; padding: 5px 20px; border-radius: 50px; margin-bottom: 30px; }
        .leaderboard { max-width: 700px; margin: 0 auto; }
        .entry { display: flex; align-items: center; background: #333; margin: 15px 0; padding: 25px; border-radius: 15px; border-left: 10px solid #f39200; transition: all 0.5s; }
        
        /* ESTILOS DEL PODIO */
        .rank-1 {
            background: linear-gradient(135deg, #f39200 0%, #c6a43e 100%);
            border-left-color: #fff;
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(243, 146, 0, 0.3);
            color: #1a1a1a;
        }
        .rank-2 {
            background: linear-gradient(135deg, #bdc3c7 0%, #7f8c8d 100%);
            border-left-color: #eee;
            transform: scale(1.02);
            color: #1a1a1a;
        }
        .rank-3 {
            background: linear-gradient(135deg, #cd7f32 0%, #a0522d 100%);
            border-left-color: #d2b48c;
            color: #1a1a1a;
        }

        .rank-1 .pts, .rank-2 .pts, .rank-3 .pts { color: #1a1a1a; text-shadow: none; }
        .rank-1 .pts { color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        
        .num { font-size: 2em; width: 60px; font-weight: 900; }
        .name { flex-grow: 1; text-align: left; font-size: 1.6em; padding-left: 15px; text-transform: uppercase; }
        .pts { font-size: 2.5em; font-weight: bold; color: #f39200; }
        #live-dot { display: inline-block; width: 10px; height: 10px; background: #4caf50; border-radius: 50%; margin-right: 6px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        #status-bar { font-size: 0.85em; color: #888; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h1 class="title-gold">MAESTRO EN CORTES</h1>
    <div class="subtitle">4ta EDICIÓN - 2026</div>
    <div id="status-bar">Conectando...</div>
    <div id="display" class="leaderboard">Cargando maestros...</div>

    <script>
        const SUPABASE_URL = 'https://uapptgffjuauwunhbvqu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ZnGg75rZoPLIAvhnCRum2A_b7jhYgYe';

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadData() {
            const { data, error } = await db
                .from('participantes')
                .select('*')
                .order('puntos', { ascending: false });

            if (error) {
                document.getElementById('status-bar').textContent = '❌ Error: ' + error.message;
                return;
            }
            render(data);
        }

        function render(data) {
            const display = document.getElementById('display');
            if (!data || data.length === 0) {
                display.innerHTML = "<p style='color:#888;'>Esperando primer puntaje...</p>";
                return;
            }
            display.innerHTML = data.map((p, i) => {
                // Lógica para asignar clases de podio
                let podioClass = '';
                if (i === 0) podioClass = 'rank-1';
                else if (i === 1) podioClass = 'rank-2';
                else if (i === 2) podioClass = 'rank-3';

                return `
                    <div class="entry ${podioClass}">
                        <div class="num">#${i + 1}</div>
                        <div class="name">${p.nombre}</div>
                        <div class="pts">${p.puntos}</div>
                    </div>
                `;
            }).join('');
        }

        db.channel('pork-public')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'participantes' }, () => {
                loadData();
            })
            .subscribe((status) => {
                const bar = document.getElementById('status-bar');
                if (status === 'SUBSCRIBED') {
                    bar.innerHTML = '<span id="live-dot"></span> EN VIVO';
                } else {
                    bar.textContent = 'Reconectando...';
                }
            });

        window.onload = loadData;
    </script>
</body>
</html>
