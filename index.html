<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking en Vivo</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: white; text-align: center; margin: 0; padding: 20px; }
        .entry { display: flex; justify-content: space-between; background: #16213e; margin: 10px 0; padding: 15px; border-radius: 10px; border-left: 5px solid #e94560; }
        .rank-1 { border-left-color: #f1c40f; background: #1f2235; transform: scale(1.02); }
        .name { font-weight: bold; font-size: 1.2em; }
        .score { color: #e94560; font-weight: bold; font-size: 1.2em; }
        #conn-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: #1a1a2e; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        input { padding: 15px; border-radius: 8px; border: none; margin-bottom: 10px; width: 80%; }
        button { padding: 15px 30px; background: #e94560; color: white; border: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="conn-screen">
        <h2>Ingresa el ID de la Sala</h2>
        <input type="text" id="roomId" placeholder="Ejemplo: 123-abc-456">
        <button onclick="connect()">Ver Clasificación</button>
    </div>

    <h1>RESULTADOS</h1>
    <div id="display"></div>

    <script>
        const peer = new Peer();
        
        function connect() {
            const id = document.getElementById('roomId').value;
            const conn = peer.connect(id);

            conn.on('open', () => {
                document.getElementById('conn-screen').style.display = 'none';
            });

            conn.on('data', (data) => {
                render(data);
            });
        }

        function render(data) {
            const display = document.getElementById('display');
            display.innerHTML = data.map((p, i) => `
                <div class="entry ${i === 0 ? 'rank-1' : ''}">
                    <span class="name">#${i+1} ${p.nombre}</span>
                    <span class="score">${p.puntos} pts</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
