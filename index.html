<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurados - Maestro en Cortes 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --pork-pink: #f65275; --pork-orange: #f39200; --dark-gray: #333; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; color: var(--dark-gray); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 20px; width: 100%; max-width: 850px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 10px solid var(--pork-orange); text-align: center; }
        
        .jurado-badge { background: #e0f2f1; color: #004d40; padding: 10px 20px; border-radius: 30px; font-weight: bold; display: inline-block; margin-bottom: 20px; font-size: 0.95em; }
        .zone-select { padding: 10px; border-radius: 8px; border: 2px solid var(--pork-orange); font-size: 1em; font-weight: bold; color: var(--dark-gray); margin-bottom: 20px; width: 100%; max-width: 300px; outline: none; }
        
        .row { background: #fff; margin-bottom: 15px; padding: 20px; border-radius: 12px; border: 1px solid #ddd; text-align: left; }
        .row-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f2f2f2; padding-bottom: 10px; margin-bottom: 15px; }
        .criteria-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 10px; }
        .criterion { display: flex; flex-direction: column; font-size: 0.85em; color: #555; }
        .criterion label { font-weight: bold; margin-bottom: 4px; color: var(--dark-gray); }
        .criterion input { padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 1.1em; text-align: center; background: #fffdfa; }
        .criterion input:focus { border-color: var(--pork-orange); outline: none; background: #fff; }
        
        .total-display { font-size: 1.2em; font-weight: bold; color: var(--pork-pink); background: #fff0f3; padding: 5px 12px; border-radius: 8px; }
        
        button { cursor: pointer; border: none; font-weight: bold; color: white; border-radius: 8px; transition: 0.2s; }
        .btn-add { background: var(--pork-pink); padding: 12px 25px; }
        .btn-edit { background: none; cursor: pointer; padding: 0 5px; color: #aaa; font-size: 1.1em; border: none; }
        .btn-edit:hover { color: var(--pork-pink); }
        .input-name { padding: 12px; border-radius: 10px; border: 2px solid #eee; flex-grow: 1; outline: none; margin-right: 10px; font-size: 1em; }
        
        .search-container { display: flex; margin-bottom: 20px; position: relative; }
        .input-search { padding: 10px 15px; border-radius: 8px; border: 1px solid #ddd; width: 100%; outline: none; font-size: 0.95em; background: #fafafa; transition: 0.3s; }
        .input-search:focus { border-color: var(--pork-pink); background: #fff; box-shadow: 0 0 8px rgba(246, 82, 117, 0.15); }

        #status { font-size: 0.8em; color: #aaa; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>MAESTRO EN CORTES <span style="color:var(--pork-orange);">2026</span></h1>
    <p style="color:var(--pork-pink); font-weight:bold; margin-bottom:10px;">RÚBRICA DE CALIFICACIÓN INDIVIDUAL JURADOS</p>
    
    <div id="juradoContainer" class="jurado-badge">Identificando jurado...</div>
    <br>
    
    <select id="zoneSelect" class="zone-select" onchange="cambiarZona()">
        <option value="Bogota - Guadalupe">Bogotá - Frigorífico Guadalupe</option>
        <option value="Medellin">Medellín - Central Ganadera</option>
        <option value="Pereira">Pereira - Planta de Beneficio OINC</option>
        <option value="Barranquilla">Barranquilla - Frigorífico Santa Cruz</option>
        <option value="Bogota - BLE">Bogotá - BLE</option>
        <option value="Cali">Cali - Carnes y Derivados de Occidente</option>
        <option value="Bogota - Corferias">Bogotá - Corferias</option>
    </select>

    <div style="display:flex; margin-bottom:20px;">
        <input type="text" id="nameIn" class="input-name" placeholder="Nombre del nuevo participante..." onkeydown="if(event.key==='Enter') addP()">
        <button class="btn-add" onclick="addP()">Añadir</button>
    </div>

    <div class="search-container">
        <input type="text" id="searchIn" class="input-search" placeholder="🔍 Buscar participante por nombre..." oninput="filtrarLista()">
    </div>

    <div id="list"></div>
    <div id="status"></div>
</div>

<script>
    const SUPABASE_URL = 'https://uapptgffjuauwunhbvqu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ZnGg75rZoPLIAvhnCRum2A_b7jhYgYe';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let nombreJurado = "";
    let zonaActual = "Bogota - Guadalupe";
    let datosLocalesParticipantes = []; 
    let datosLocalesCalificaciones = [];

    function inicializarJurado() {
        nombreJurado = localStorage.getItem("nombre_jurado");
        if (!nombreJurado || nombreJurado.trim() === "") {
            nombreJurado = prompt("Por favor, ingrese su Nombre de Jurado o Número de Mesa (Ej: Jurado 1, Mesa A):");
            if (!nombreJurado || nombreJurado.trim() === "") {
                nombreJurado = "Jurado Anónimo_" + Math.floor(Math.random() * 100);
            }
            localStorage.setItem("nombre_jurado", nombreJurado.trim());
        }
        document.getElementById("juradoContainer").innerHTML = `📝 Evaluando como: <strong>${nombreJurado}</strong> <span style="cursor:pointer;margin-left:10px;" onclick="cambiarJurado()">🔄</span>`;
        
        if(localStorage.getItem("zona_actual")) {
            zonaActual = localStorage.getItem("zona_actual");
            document.getElementById("zoneSelect").value = zonaActual;
        }
    }

    function cambiarJurado() {
        localStorage.removeItem("nombre_jurado");
        location.reload();
    }

    function cambiarZona() {
        zonaActual = document.getElementById("zoneSelect").value;
        localStorage.setItem("zona_actual", zonaActual);
        fetchAndRender();
    }

    function setStatus(msg) { document.getElementById('status').textContent = msg; }

    function calcularNotaParcial(calif) {
        if (!calif) return "0.00";
        const nTecnica = (calif.tecnica || 0) * 0.35;
        const nRendimiento = (calif.rendimiento || 0) * 0.25;
        const nHigiene = (calif.higiene || 0) * 0.20;
        const nParametros = (calif.parametros || 0) * 0.10;
        const nPresentacion = (calif.presentacion || 0) * 0.10;
        return (nTecnica + nRendimiento + nHigiene + nParametros + nPresentacion).toFixed(2);
    }

    async function fetchAndRender() {
        const { data: participantes, error: errP } = await db.from('participantes').select('*').eq('zona', zonaActual).order('nombre', { ascending: true });
        if (errP) { setStatus('❌ Error de conexión'); return; }
        
        const { data: calificaciones, error: errC } = await db.from('calificaciones').select('*').eq('jurado', nombreJurado);
        if (errC) { console.error(errC); return; }

        setStatus(`✅ Sede: ${zonaActual} · ` + participantes.length + ' competidores activos');

        datosLocalesParticipantes = participantes;
        datosLocalesCalificaciones = calificaciones;

        filtrarLista();
    }

    function filtrarLista() {
        const textoBusqueda = document.getElementById('searchIn').value.toLowerCase().trim();
        const list = document.getElementById('list');

        if (datosLocalesParticipantes.length === 0) {
            list.innerHTML = '<p style="color:#aaa;">No hay participantes registrados en esta ciudad.</p>';
            return;
        }

        const filtrados = datosLocalesParticipantes.filter(p => p.nombre.toLowerCase().includes(textoBusqueda));

        if (filtrados.length === 0) {
            list.innerHTML = '<p style="color:#aaa;">No se encontraron participantes.</p>';
            return;
        }

        list.innerHTML = filtrados.map(p => {
            const miCalificacion = datosLocalesCalificaciones.find(c => c.participante_id === p.id) || {
                tecnica: 0, rendimiento: 0, higiene: 0, parametros: 0, presentacion: 0
            };

            return `
                <div class="row">
                    <div class="row-header">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span style="font-weight:bold; font-size:1.2em;">${p.nombre}</span>
                            <button class="btn-edit" onclick="editName(${p.id}, '${p.nombre}')" title="Editar nombre">✏️</button>
                        </div>
                        <div class="total-display">Mi Nota: ${calcularNotaParcial(miCalificacion)}</div>
                    </div>
                    <div class="criteria-grid">
                        <div class="criterion">
                            <label>Técnica (35%)</label>
                            <input type="number" min="0" max="10" step="0.1" value="${miCalificacion.tecnica}" onchange="guardarNota(${p.id}, 'tecnica', this.value)">
                        </div>
                        <div class="criterion">
                            <label>Rendimiento (25%)</label>
                            <input type="number" min="0" max="10" step="0.1" value="${miCalificacion.rendimiento}" onchange="guardarNota(${p.id}, 'rendimiento', this.value)">
                        </div>
                        <div class="criterion">
                            <label>Higiene (20%)</label>
                            <input type="number" min="0" max="10" step="0.1" value="${miCalificacion.higiene}" onchange="guardarNota(${p.id}, 'higiene', this.value)">
                        </div>
                        <div class="criterion">
                            <label>Parámetros (10%)</label>
                            <input type="number" min="0" max="10" step="0.1" value="${miCalificacion.parametros}" onchange="guardarNota(${p.id}, 'parametros', this.value)">
                        </div>
                        <div class="criterion">
                            <label>Presentación (10%)</label>
                            <input type="number" min="0" max="10" step="0.1" value="${miCalificacion.presentacion}" onchange="guardarNota(${p.id}, 'presentacion', this.value)">
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    async function addP() {
        const nameInput = document.getElementById('nameIn');
        const name = nameInput.value.trim();
        if (!name) return;
        await db.from('participantes').insert([{ nombre: name, zona: zonaActual }]);
        nameInput.value = "";
        fetchAndRender();
    }

    async function guardarNota(participanteId, criterio, valor) {
        const valNum = parseFloat(valor) || 0;
        const { data } = await db.from('calificaciones').select('id').eq('participante_id', participanteId).eq('jurado', nombreJurado);

        if (data && data.length > 0) {
            await db.from('calificaciones').update({ [criterio]: valNum }).eq('id', data[0].id);
        } else {
            const nuevaFila = {
                participante_id: participanteId,
                jurado: nombreJurado,
                tecnica: 0, rendimiento: 0, higiene: 0, parametros: 0, presentacion: 0
            };
            nuevaFila[criterio] = valNum;
            await db.from('calificaciones').insert([nuevaFila]);
        }
        fetchAndRender();
    }

    async function editName(id, oldName) {
        const newName = prompt("Editar nombre del participante:", oldName);
        if (newName && newName.trim() !== "" && newName !== oldName) {
            await db.from('participantes').update({ nombre: newName.trim() }).eq('id', id);
            fetchAndRender();
        }
    }

    db.channel('pork-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'participantes' }, () => fetchAndRender())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'calificaciones' }, () => fetchAndRender())
      .subscribe();

    window.onload = () => {
        inicializarJurado();
        fetchAndRender();
    };
</script>
</body>
</html>
