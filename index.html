<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Jurados - Porkcolombia 2026</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1e1e2f; color: #efefef; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: #27293d; padding: 25px; border-radius: 15px; width: 100%; max-width: 750px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .status-box { background: #32354a; padding: 12px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid #00f2c3; }
        .controls-top { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 12px; border-radius: 8px; border: 1px solid #3d3f51; background: #1e1e2f; color: white; flex-grow: 1; }
        .row { display: flex; justify-content: space-between; align-items: center; background: #32354a; margin-bottom: 10px; padding: 15px; border-radius: 12px; }
        .score-box { font-weight: bold; color: #00f2c3; font-size: 1.3em; min-width: 40px; text-align: center; margin-right: 10px; }
        .btn-group { display: flex; gap: 4px; }
        button { padding: 8px 10px; cursor: pointer; border-radius: 6px; border: none; font-weight: bold; color: white; transition: 0.2s; min-width: 38px; }
        .btn-add { background: #00f2c3; color: #1e1e2f; padding: 12px 20px; }
        .btn-minus { background: #fd5d93; }
        .btn-plus { background: #4d7cfe; }
        .btn-edit { background: transparent; border: 1px solid #ff8d72; color: #ff8d72; font-size: 0.8em; margin-left: 8px; padding: 4px 8px; }
        h2 { margin-top: 0; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h2>Panel de Calificación (Jurados)</h2>
    <div class="status-box">
        📡 Canal Activo: <strong>concurso-porkcolombia-2026</strong>
    </div>

    <div class="controls-top">
        <input type="text" id="nameIn" placeholder="Nombre del participante...">
        <button class="btn-add" onclick="addP()">Añadir</button>
    </div>

    <input type="text" id="searchIn" style="width:96%; margin-bottom:15px;" placeholder="🔍 Buscar participante para calificar..." oninput="render()">

    <div id="list"></div>
</div>

<script>
    const SALA_ID = 'concurso-porkcolombia-2026';
    const peer = new Peer(SALA_ID); 
    let data = JSON.parse(localStorage.getItem('pork_data')) || [];
    let connections = [];

    peer.on('open', (id) => { console.log('Servidor iniciado:', id); });

    peer.on('connection', (conn) => {
        connections.push(conn);
        conn.on('open', () => { conn.send(sortData()); });
    });

    function addP() {
        const n = document.getElementById('nameIn');
        if(!n.value.trim()) return;
        data.push({ nombre: n.value.trim(), puntos: 0 });
        n.value = "";
        saveAndSync();
    }

    function updateScore(index, val) {
        data[index].puntos += val;
        saveAndSync();
    }

    function editName(index) {
        const nuevo = prompt("Editar nombre:", data[index].nombre);
        if (nuevo) { data[index].nombre = nuevo.trim(); saveAndSync(); }
    }

    function sortData() {
        return [...data].sort((a, b) => b.puntos - a.puntos);
    }

    function saveAndSync() {
        localStorage.setItem('pork_data', JSON.stringify(data));
        render();
        const sorted = sortData();
        connections.forEach(c => { if(c.open) c.send(sorted); });
    }

    function render() {
        const list = document.getElementById('list');
        const term = document.getElementById('searchIn').value.toLowerCase();
        list.innerHTML = data.map((p, i) => {
            if (!p.nombre.toLowerCase().includes(term)) return '';
            return `
                <div class="row">
                    <div style="flex-grow:1">
                        <span>${p.nombre}</span>
                        <button class="btn-edit" onclick="editName(${i})">✎</button>
                    </div>
                    <div class="score-box">${p.puntos}</div>
                    <div class="btn-group">
                        <button class="btn-minus" onclick="updateScore(${i},-1)">-1</button>
                        <button class="btn-plus" onclick="updateScore(${i},1)">+1</button>
                        <button class="btn-plus" onclick="updateScore(${i},2)">+2</button>
                        <button class="btn-plus" onclick="updateScore(${i},3)">+3</button>
                        <button class="btn-plus" onclick="updateScore(${i},4)">+4</button>
                        <button class="btn-plus" onclick="updateScore(${i},5)">+5</button>
                    </div>
                </div>`;
        }).join('');
    }
    window.onload = render;
</script>
</body>
</html>
